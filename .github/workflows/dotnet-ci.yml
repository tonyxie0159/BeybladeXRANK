name: .NET CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dotnet-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore BeybladeXRANK-main/BeybladeRecordSystem.slnx

      - name: Build
        run: dotnet build BeybladeXRANK-main/BeybladeRecordSystem.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test BeybladeXRANK-main/BeybladeRecordSystem.slnx --configuration Release --no-build
