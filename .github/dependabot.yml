version: 2

updates:
  - package-ecosystem: nuget
    directories:
      - /BeybladeXRANK-main/src/BeybladeRecordSystem
      - /BeybladeXRANK-main/tests/BeybladeRecordSystem.Tests
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
